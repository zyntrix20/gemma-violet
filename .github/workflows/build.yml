name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/SerOAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SerOAI.apk
          path: out/SerOAI.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: SerOAI 1.1.${{ github.run_number }}
          body: "Установите SerOAI.apk на Android-телефон. При первом запуске приложение скачает модель (~2.6 ГБ)."
          files: out/SerOAI.apk
          make_latest: true
