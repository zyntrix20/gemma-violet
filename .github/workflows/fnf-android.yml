name: Build Android APK

on:
  push:
    paths:
      - 'fnf-engine/**'
      - '.github/workflows/fnf-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: fnf-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # the runner image already ships the SDK; just add the platform and build tools
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-30" "platforms;android-33" "build-tools;30.0.3" "build-tools;34.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: false

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Cache haxelib and build objects
        uses: actions/cache@v4
        with:
          key: fnf-android-${{ hashFiles('fnf-engine/Project.xml', '.github/workflows/fnf-android.yml') }}
          restore-keys: fnf-android-
          path: |
            ~/haxelib
            fnf-engine/export/release/android/obj

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.3.2 --quiet --always
          haxelib install lime 8.1.2 --quiet --always
          haxelib install openfl 9.3.3 --quiet --always
          haxelib install flixel 5.6.1 --quiet --always
          haxelib install flixel-addons 3.2.2 --quiet --always
          haxelib install flixel-tools 1.5.1 --quiet --always
          haxelib install hscript-iris 1.1.3 --quiet --always
          haxelib install tjson 1.4.0 --quiet --always
          haxelib install hxvlc 2.0.1 --skip-dependencies --quiet --always
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e --quiet --always
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7 --quiet --always
          haxelib set hxcpp 4.3.2 --always
          haxelib set lime 8.1.2 --always
          haxelib set openfl 9.3.3 --always
          haxelib list

      - name: Configure lime for Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Build APK
        run: haxelib run lime build android -final -arm64 -armv7 --app-version="1.0.${{ github.run_number }}"

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p out
          APK=$(find export/release/android/bin/app/build/outputs/apk -name '*.apk' | sort | tail -n 1)
          [ -n "$APK" ] || { echo 'No APK was produced'; exit 1; }
          echo "Built: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            PASS="$KEYSTORE_PASSWORD"
          else
            # No signing secret configured: use a throwaway key so the APK installs.
            PASS=android
            keytool -genkeypair -keystore release.keystore -storepass "$PASS" -keypass "$PASS" \
              -alias engine -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Funkin Mod Engine"
          fi
          ALIAS=$(keytool -list -keystore release.keystore -storepass "$PASS" | grep PrivateKeyEntry | head -n 1 | cut -d, -f1)
          "$BT/zipalign" -f -p 4 "$APK" out/aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out out/FunkinModEngine.apk out/aligned.apk
          "$BT/apksigner" verify out/FunkinModEngine.apk
          rm -f out/aligned.apk release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: FunkinModEngine.apk
          path: fnf-engine/out/FunkinModEngine.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fnf-v1.0.${{ github.run_number }}
          name: Funkin Mod Engine 1.0.${{ github.run_number }}
          body: |
            Установите FunkinModEngine.apk на Android-телефон.
            В главном меню откройте «Mods» → «IMPORT MOD (.ZIP)» и выберите архив мода (Psych Engine, V-Slice или Codename Engine).
          files: fnf-engine/out/FunkinModEngine.apk
          make_latest: true
